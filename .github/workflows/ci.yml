name: CI

on:
  push:
  pull_request:

# Read-only, and stated rather than inherited. On a public repository
# this workflow runs against pull requests from forks, so the token it
# hands to third-party code should be able to do nothing but read this
# checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
      # bundler-cache is off on purpose. It sets BUNDLE_PATH=vendor/bundle,
      # which leaves the system gem home holding only Ruby's own bundled
      # gems. One acceptance test builds a second bundle whose Gemfile
      # omits debug, and installs it with `bundle install --local` from an
      # unbundled environment; that resolver reads the system gem home, so
      # a vendored parent bundle makes it fail to find the pinned minitest.
      # Installing into the system gem home keeps the two in one place.
      - run: bundle install --jobs 4
      - run: bundle exec rake
      - run: bundle exec rake coverage

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - name: Write the signatures from lib/
        run: bundle exec rbs-inline --output=sig/generated lib
      # intent-to-add makes a new file that nobody committed show in the diff too.
      - name: Check that the committed signatures are current
        run: git add --intent-to-add sig && git diff --exit-code sig
      - name: Check lib/ with Steep
        run: |
          # Steep logs FATAL or ERROR and skips the rest of a method when it
          # cannot type a node, and still prints "No type error detected".
          set -o pipefail
          bundle exec steep check 2>&1 | tee steep.log
          if grep -E ': (FATAL|ERROR): \[Steep' steep.log; then
            echo "Steep stopped checking the code on the lines above." >&2
            exit 1
          fi
